version: 2

sources:
  - name: raw_m5
    description: "Raw ingested Walmart M5 Point of Sale transactional datasets"
    tables:
      - name: calendar
        description: "Calendar metadata covering 1,969 days with holidays and SNAP indicators"
      - name: store_dept_daily
        description: "Aggregated daily units across stores and departments"
      - name: sell_prices
        description: "Weekly selling prices per item and store"

models:
  - name: stg_calendar
    description: "Cleaned and typed calendar lookup table"
    columns:
      - name: date
        description: "Primary key date"
        tests:
          - unique
          - not_null
      - name: day_index
        tests:
          - not_null

  - name: stg_sales
    description: "Cleaned daily store-department sales records"
    columns:
      - name: sales_units
        description: "Daily units sold (non-negative)"
        tests:
          - not_null

  - name: stg_sell_prices
    description: "Cleaned weekly item sell prices"
    columns:
      - name: sell_price
        description: "Weekly selling price in USD"
        tests:
          - not_null
